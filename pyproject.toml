[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-W", "ignore::FutureWarning",
    "-W", "ignore::DeprecationWarning",
    # Tests del dashboard temporalmente excluidos por errores conocidos
    # (ver AUDITORIA.md → "Notas para sprint dashboard"). Reactivar al
    # iniciar el sprint dedicado de dashboard.
    "--ignore=tests/test_dashboard_bitacora.py",
    "--ignore=tests/test_dashboard_smoke.py",
]
markers = [
    "slow: tests que tardan >5s",
    "integration: tests que tocan servicios externos (DB, Alpaca)",
    "property: property-based tests con hypothesis",
]

# ── coverage ─────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = [
    "borsenhirn",
    "strategy",
    "risk_manager",
    "circuit_breaker",
    "ml_model",
    "indicators",
    "regime_detector",
    "m3_risk",
]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "setup_proyecto.py",
    "setup_borsenhirn.py",
    "borsenhirn/api/*",
    "borsenhirn/dashboard/*",
    "scripts/*",
    "fixes.py",
    "versions.py",
    "my_plan.py",
    "generate_report.py",
    "gen_daily_report.py",
    "daily_report.py",
    "reporter.py",
    "dashboard.py",
    "dashboard_m5_patch.py",
    "menu.py",
    "auditor.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ── ruff (linter) ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["setup_proyecto.py", "setup_borsenhirn.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines — lo controlamos con line-length

# ── mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
