name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Lint + Tests + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r requirements.in
          fi

      - name: Install dev dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements-dev.in
          fi

      - name: Lint with ruff
        run: ruff check . --output-format=github
        continue-on-error: true   # avisar pero no bloquear (apretar después)

      - name: Run tests with coverage
        run: |
          pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  reproducibility:
    name: Verify model reproducibility
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r requirements.in
          fi

      - name: Run reproducibility check
        run: python scripts/verify_reproducibility.py

  language-audit:
    name: Audit lenguaje legalmente riesgoso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Run audit (HIGH only)
        run: python scripts/audit_language.py
        continue-on-error: true   # MEDIUM no bloquea
